[package]
name = "quic-interop"
version = "0.1.0"
edition = "2021"
publish = false

# quinn 0.11 peers for interop with neton quic (Kotlin/Native, OpenSSL TLS): an echo server and an echo client,
# both with rustls (ring provider), TLS 1.3 only, ALPN "neton-interop", certificates verified against a test CA.

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
