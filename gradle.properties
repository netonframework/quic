kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.stability.nowarn=true
# Shared source sets (linuxMain, appleMain) are compiled once for publishing; their cinterop
# bindings must be commonized across the targets they cover or that compile cannot see them.
kotlin.mpp.enableCInteropCommonization=true
